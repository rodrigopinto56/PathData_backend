# ---------------------------------------------------------------------------
# Modelo de riesgo de incumplimiento
# ---------------------------------------------------------------------------
modelo_riesgo:
  algoritmo: "LogisticRegression (scikit-learn)"
  razon_algoritmo: >
    Con solo 2 variables predictoras y ~300 filas de entrenamiento, un
    modelo lineal simple es mas apropiado que uno complejo (menor riesgo
    de sobreajuste, y los coeficientes son interpretables: se puede
    explicar en una frase que tanto pesa cada variable en el riesgo).

  entrena_sobre: loan_default_risk
  target: Loan_Default_Risk   

  features:
    - nombre_entrenamiento: Debt_Amount
      nombre_en_personal_finance_ml: loan_amount_usd
      justificacion: "Ambas son montos de deuda/prestamo en dolares (misma unidad y escala)."
    - nombre_entrenamiento: Monthly_Savings
      nombre_en_personal_finance_ml: savings_usd
      justificacion: "Ambas representan ahorro del usuario (dataCatalog.yml ya documentaba esta equivalencia)."

  feature_excluida:
    nombre: Retirement_Age
    razon: >
      No existe una columna equivalente confirmada en personal_finance_ml
      ('age' es edad actual, no edad de retiro planeada - son conceptos
      distintos). Decision (confirmada con el equipo): excluirla del
      modelo en vez de inventar un mapeo. El modelo queda con 2 features
      en lugar de 3. Si en el futuro se agrega una columna real de edad
      de retiro planeada, se puede reincorporar sin cambiar el resto del
      diseno.

  aplica_sobre: personal_finance_ml   
  salida_inferencia:
    - nombre: riesgo_score
      tipo: double
      descripcion: "Probabilidad de incumplimiento estimada por el modelo (0.0 a 1.0)."
    - nombre: riesgo_flag
      tipo: string
      descripcion: "'Alto' si riesgo_score >= 0.5, 'Bajo' en caso contrario."

  nota_limitacion: >
    El modelo se re-entrena en cada corrida del DAG, sobre la particion
    de loan_default_risk del dia (no hay registro/versionado de modelo
    todavia). Es una simplificacion valida para el alcance de esta
    semana; un pipeline de ML en produccion normalmente separa
    entrenamiento (con su propio ciclo de vida y evaluacion) de
    inferencia (que reusa un modelo ya versionado). Se documenta como
    mejora futura.

# ---------------------------------------------------------------------------
# Tablas Gold
# ---------------------------------------------------------------------------
tablas:

  gold_clientes_riesgo:
    grano: "un renglon por user_id (particionado por fecha, igual que Silver)"
    descripcion: >
      Perfil financiero de cada cliente enriquecido con su score de
      riesgo. Es la tabla de detalle: sirve para responder "que clientes
      estan en riesgo alto" o para alimentar un CRM/BI a nivel individual.
    columnas_origen_silver:
      - user_id
      - age
      - gender
      - region
      - employment_status
      - monthly_income_usd
      - monthly_expenses_usd
      - savings_usd
      - has_loan
      - loan_amount_usd
      - debt_to_income_ratio
      - credit_score
    columnas_calculadas:
      - riesgo_score
      - riesgo_flag

  gold_metricas_por_segmento:
    grano: "una fila por region x rango_credit_score (particionado por fecha)"
    descripcion: >
      Metricas de negocio agregadas, listas para dashboard/BI. No es
      detalle por cliente, es la vista "resumen ejecutivo" de la capa Gold.
    dimensiones:
      - region
      - rango_credit_score   
    metricas:
      - nombre: num_clientes
        calculo: "conteo de user_id"
      - nombre: ingreso_promedio_usd
        calculo: "promedio de monthly_income_usd"
      - nombre: ahorro_promedio_usd
        calculo: "promedio de savings_usd"
      - nombre: pct_con_prestamo
        calculo: "% de filas con has_loan = 'Yes'"
      - nombre: deuda_ingreso_promedio
        calculo: "promedio de debt_to_income_ratio"
      - nombre: pct_riesgo_alto
        calculo: "% de filas con riesgo_flag = 'Alto'"

bandas_credit_score:
  - rango: "300-579"
    etiqueta: "Bajo"
  - rango: "580-669"
    etiqueta: "Regular"
  - rango: "670-739"
    etiqueta: "Bueno"
  - rango: "740-799"
    etiqueta: "Muy bueno"
  - rango: "800-850"
    etiqueta: "Excelente"

# ===========================================================================
# Semana 11 (cierre): modelo analitico normalizado -- esquema estrella
# ===========================================================================
# Implementacion: scripts/modelo_dimensional.py
# Ruta en MinIO:  gold-layer/<tabla>/<YYYY/MM/DD>/data.parquet
#
#                   dim_fecha
#                       |
#   dim_cliente --- fact_posicion_financiera --- dim_region
#                    /                 \
#       dim_banda_credito        dim_tipo_prestamo
#
# gold_clientes_riesgo y gold_metricas_por_segmento (arriba) se mantienen
# como tablas de consumo directo del dashboard; el modelo estrella es la
# fuente normalizada sobre la que se calculan los KPIs de la Semana 12.
modelo_dimensional:

  dim_fecha:
    grano: "una fila por fecha de particion"
    llave_primaria: fecha_id            # entero YYYYMMDD
    columnas: [fecha_id, fecha, anio, trimestre, mes, dia, dia_semana, semana_anio]

  dim_cliente:
    grano: "una fila por user_id"
    llave_primaria: user_id             # llave natural, ya validada unica en Silver
    columnas: [user_id, age, rango_edad, gender, employment_status]
    columnas_opcionales: [education_level, job_title]   # si vienen en Silver
    rangos_edad: ["18-24", "25-34", "35-44", "45-54", "55-64", "65+"]

  dim_region:
    grano: "una fila por region"
    llave_primaria: region_id           # surrogada, orden alfabetico (determinista)
    columnas: [region_id, region]

  dim_banda_credito:
    grano: "una fila por banda de credit score (ver bandas_credit_score)"
    llave_primaria: banda_id            # 1 = Bajo ... 5 = Excelente, 0 = Sin clasificar
    columnas: [banda_id, rango_credit_score, score_min, score_max]

  dim_tipo_prestamo:
    grano: "una fila por tipo de prestamo"
    llave_primaria: tipo_prestamo_id    # surrogada, orden alfabetico
    columnas: [tipo_prestamo_id, tipo_prestamo]
    nota: "loan_type nulo (has_loan = No) se mapea al miembro 'Sin prestamo', asi la FK nunca es nula."

  fact_posicion_financiera:
    grano: "una fila por cliente por fecha de particion (snapshot)"
    llaves_foraneas:
      fecha_id: dim_fecha
      user_id: dim_cliente
      region_id: dim_region
      banda_id: dim_banda_credito
      tipo_prestamo_id: dim_tipo_prestamo
    medidas_base: [monthly_income_usd, monthly_expenses_usd, savings_usd, tiene_prestamo,
                   loan_amount_usd, debt_to_income_ratio, credit_score]
    medidas_opcionales: [loan_term_months, monthly_emi_usd, loan_interest_rate_pct]
    medidas_modelo: [riesgo_score, es_riesgo_alto]
    medidas_derivadas:
      flujo_libre_mensual_usd: "monthly_income_usd - monthly_expenses_usd"
      tasa_ahorro: "(monthly_income_usd - monthly_expenses_usd) / monthly_income_usd"
      ratio_gasto_ingreso: "monthly_expenses_usd / monthly_income_usd"
      meses_cobertura_ahorro: "savings_usd / monthly_expenses_usd"
      perdida_esperada_usd: "riesgo_score (PD) x loan_amount_usd (EAD) x LGD"

  integridad:
    descripcion: >
      construir_gold.py valida el modelo antes de escribirlo y falla la
      tarea si algo no cumple (en vez de publicar un modelo roto).
    reglas:
      - "PK unica y no nula en cada dimension"
      - "Toda FK de fact_posicion_financiera existe en su dimension (0 huerfanos)"
      - "Grano unico en el hecho: (user_id, fecha_id)"


# ===========================================================================
# Semanas 11-12: metricas financieras y KPIs
# ===========================================================================
# Implementacion: scripts/kpis_financieros.py (catalogo CATALOGO_KPIS)
# Salidas: gold_kpis_financieros (formato largo: fecha, categoria, kpi,
#          valor, unidad, umbral, estado) y gold_kpis_por_segmento.
parametros_financieros:
  lgd: 0.45
  razon_lgd: >
    Loss Given Default supervisor de Basilea II (IRB basico) para deuda
    senior sin garantia. No hay datos de recuperacion propios; si llegan,
    se reemplaza por una LGD observada.
  umbral_endeudamiento_mensual: 0.36
  razon_endeudamiento: >
    Meta de negocio de la lamina "KPI Negocio": destinar menos del 36%
    del ingreso mensual al pago de deudas es saludable. Reemplaza al
    umbral anterior sobre debt_to_income_ratio: en los datos reales esa
    columna tiene mediana 1.35, o sea que mide deuda total vs ingreso, no
    el pago mensual -- no sirve para este KPI.
  meses_colchon_minimo: 3
  umbral_perfil_ahorrador: 0.20   # regla 50/30/20

metricas_financieras:

  # Los 4 KPIs de la lamina "KPI Negocio"
  kpis_negocio:
    - kpi: capacidad_ahorro_mediana_pct
      formula: "median((ingreso - gasto) / ingreso) x 100"
      umbral: "< 20 = ALERTA (meta 20% saludable)"
      bandas_confianza: >
        capacidad_ahorro_ic95_inf_pct / _sup_pct: intervalo de confianza
        95% de la mediana por bootstrap (500 re-muestras, semilla 42).
        Tambien por segmento en gold_kpis_por_segmento.
    - kpi: endeudamiento_mensual_mediana_pct
      formula: "median(pago_mensual_deuda / ingreso_mensual) x 100, clientes con prestamo"
      umbral: "> 36 = ALERTA"
      fuente_pago_mensual: >
        1) monthly_emi_usd si existe; 2) si no, formula de amortizacion
        P*r/(1-(1+r)^-n) con loan_amount_usd, loan_interest_rate_pct y
        loan_term_months; 3) si no, N/D. La fuente usada queda en
        _gold_metadata (fuente_pago_mensual).
    - {kpi: pct_clientes_endeudamiento_alto, formula: "% con prestamo y endeudamiento > 36%", umbral: "> 25 = ALERTA"}
    - kpi: varianza_ingresos_gastos
      formula: "coeficiente de variacion (desv. estandar / promedio) de ingreso y gasto mensual en 3-6 meses"
      estado: SIN_DATOS
      razon: >
        personal_finance_ml es una foto (un renglon por cliente) y las
        particiones diarias recargan los mismos datos: no hay historial
        mensual por cliente. Siguiente paso: evaluar el dataset
        ramyapintchy/personal-finance-data (transacciones con fecha) como
        "cliente demo" del gemelo digital.
    - kpi: indice_riesgo_consolidado_promedio
      formula: "promedio del indice 0-100 por cliente (ver indice_riesgo_consolidado)"
      umbral: "> 40 = ALERTA"
    - {kpi: pct_clientes_semaforo_alto, formula: "% indice >= 70", umbral: "> 20 = ALERTA"}

  indice_riesgo_consolidado:
    implementacion: "scripts/modelo_dimensional.py (PESOS_INDICE_RIESGO, ESCALAS_INDICE_RIESGO)"
    escala: "0 = sano, 100 = riesgoso; cada componente se lleva a 0-1 de forma lineal y se recorta"
    componentes:
      - {nombre: endeudamiento mensual, peso: 0.30, sano: "<= 20%", riesgoso: ">= 36%"}
      - {nombre: probabilidad de incumplimiento (modelo), peso: 0.30, sano: "0", riesgoso: "1"}
      - {nombre: capacidad de ahorro, peso: 0.20, sano: ">= 20%", riesgoso: "<= 0%"}
      - {nombre: credit score, peso: 0.20, sano: ">= 740", riesgoso: "<= 580"}
    dato_faltante: "el peso del componente faltante se reparte entre los demas (no cuenta como 0)"
    semaforo: {Bajo: "< 40", Medio: "40 - 70", Alto: ">= 70"}
    razon_pesos: >
      Criterio experto (no hay incumplimientos reales en
      personal_finance_ml para calibrarlos). El credit score entra aqui
      porque el modelo de riesgo no lo puede usar: loan_default_risk, su
      dataset de entrenamiento, no trae esa columna.

  riesgo_financiero:
    - {kpi: tasa_incumplimiento_historica_pct, formula: "mean(Loan_Default_Risk) x 100 en loan_default_risk", umbral: null}
    - {kpi: probabilidad_incumplimiento_promedio_pct, formula: "mean(riesgo_score) x 100", umbral: "> 30 = ALERTA"}
    - {kpi: pct_clientes_riesgo_alto, formula: "% es_riesgo_alto = 1", umbral: "> 20 = ALERTA"}
    - {kpi: credit_score_promedio, formula: "mean(credit_score)", umbral: "< 670 = ALERTA"}
    - {kpi: pct_clientes_subprime, formula: "% credit_score < 580", umbral: "> 20 = ALERTA"}
    - {kpi: dti_mediana, formula: "median(debt_to_income_ratio) con prestamo (deuda total vs ingreso, informativo)", umbral: null}
    - {kpi: auc_modelo_riesgo, formula: "AUC de LogisticRegression en test", umbral: "< 0.70 = ALERTA"}

  exposicion:
    - {kpi: num_prestamos_activos, formula: "sum(tiene_prestamo)", umbral: null}
    - {kpi: pct_clientes_con_prestamo, formula: "% tiene_prestamo = 1", umbral: null}
    - {kpi: exposicion_total_usd, formula: "sum(loan_amount_usd) con prestamo (EAD)", umbral: null}
    - {kpi: exposicion_promedio_usd, formula: "exposicion_total / num_prestamos", umbral: null}
    - {kpi: exposicion_riesgo_alto_usd, formula: "sum(loan_amount_usd) donde es_riesgo_alto = 1", umbral: null}
    - {kpi: pct_exposicion_riesgo_alto, formula: "exposicion_riesgo_alto / exposicion_total x 100", umbral: "> 20 = ALERTA"}
    - {kpi: perdida_esperada_usd, formula: "sum(PD x EAD x LGD)", umbral: null}
    - {kpi: perdida_esperada_pct_exposicion, formula: "perdida_esperada / exposicion_total x 100", umbral: "> 5 = ALERTA"}
    - {kpi: indice_concentracion_region_hhi, formula: "sum(participacion_region^2)", umbral: "> 0.25 = ALERTA"}
    - {kpi: pct_exposicion_region_principal, formula: "max(exposicion_region) / exposicion_total x 100", umbral: null}

  comportamiento_transaccional:
    - {kpi: ingreso_mensual_promedio_usd, formula: "mean(monthly_income_usd)", umbral: null}
    - {kpi: gasto_mensual_promedio_usd, formula: "mean(monthly_expenses_usd)", umbral: null}
    - {kpi: ratio_gasto_ingreso_mediana, formula: "median(ratio_gasto_ingreso)", umbral: null}
    - {kpi: tasa_ahorro_mediana_pct, formula: "median(tasa_ahorro) x 100", umbral: "< 20 = ALERTA"}
    - {kpi: flujo_libre_mensual_mediana_usd, formula: "median(flujo_libre_mensual_usd)", umbral: null}
    - {kpi: pct_clientes_deficitarios, formula: "% flujo_libre_mensual_usd < 0", umbral: "> 15 = ALERTA"}
    - {kpi: meses_cobertura_ahorro_mediana, formula: "median(meses_cobertura_ahorro)", umbral: "< 3 = ALERTA"}
    - {kpi: pct_clientes_sin_colchon, formula: "% meses_cobertura_ahorro < 3", umbral: "> 30 = ALERTA"}

  nota_medianas: >
    Para montos con cola larga (ahorro, flujo libre, cobertura) se usa la
    mediana: el ahorro llega a cientos de miles de dolares en pocos
    clientes y el promedio no representa al cliente tipico.

  segmentacion:
    tabla: gold_kpis_por_segmento
    dimensiones: [region, rango_credit_score, tipo_prestamo, rango_edad, employment_status, perfil_ahorro]
    perfil_ahorro: "Deficitario (tasa_ahorro < 0), Equilibrado (0-20%), Ahorrador (>= 20%)"
